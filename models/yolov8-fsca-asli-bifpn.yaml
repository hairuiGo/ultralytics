# YOLOv8 with CoordAtt and BiFPN
nc: 2  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1 P2/4
  - [-1, 3, C2f,  [128, True]]
  - [-1, 1, FS_Attention_ECA_CA, [128]]         # 3 ★ CA

  - [-1, 1, Conv, [256, 3, 2]]       # P3/8
  - [-1, 6, C2f,  [256, True]]
  - [-1, 1, FS_Attention_ECA_CA, [256]]         # 6 ★ CA

  - [-1, 1, Conv, [512, 3, 2]]       # P4/16
  - [-1, 6, C2f,  [512, True]]
  - [-1, 1, FS_Attention_ECA_CA, [512]]         # 9 ★ CA

  - [-1, 1, Conv, [1024, 3, 2]]      # P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, FS_Attention_ECA_CA, [1024]]        # 12 ★ CA

  - [-1, 1, SPPF, [1024, 5]]         # 13

head:
  - [6, 1, Conv, [256, 1, 1]]        # 14  proj P3
  - [9, 1, Conv, [256, 1, 1]]        # 15  proj P4
  - [13, 1, Conv, [256, 1, 1]]       # 16  proj P5

  # ASLI_BiFPN → produces 3 outputs: 17,18,19
  - [[14, 15, 16], 1, ASLI_BiFPN, [256, 2]] # 17 P3, P4, P5

  - [[17, 18, 19], 1, Detect, [nc]]
