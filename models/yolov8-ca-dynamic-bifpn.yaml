# YOLOv8 with CoordAtt and BiFPN
nc: 2  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1 P2/4
  - [-1, 3, C2f,  [128, True]]       # p2 / 2

  - [-1, 1, Conv, [256, 3, 2]]       # P3/3
  - [-1, 6, C2f,  [256, True]]          # p3 / 4

  - [-1, 1, Conv, [512, 3, 2]]       # P4/5
  - [-1, 6, C2f,  [512, True]]          # p4 / 6

  - [-1, 1, Conv, [1024, 3, 2]]      # P5/7
  - [-1, 3, C2f, [1024, True]]          # p5/8
  - [-1, 1, SPPF, [1024, 5]]            # p5/9

head:
  - [4, 1, Conv, [256, 1, 1]]        # 10  proj P3
  - [6, 1, Conv, [256, 1, 1]]        # 11  proj P4
  - [9, 1, Conv, [256, 1, 1]]        # 12  proj P5

  # BiFPN → produces 3 outputs: 13,14,15
  # - [[14, 15, 16], 1, ASLI_BiFPN, [256, 2]] # 13 P3, P4, P5
  - [[10, 11, 12], 1, DynamicBiFPN, [256, 2]] # 13 P3, P4, P5

  - [[13, 14, 15], 1, Detect, [nc]]
